syntax = "proto3";


service NoVersionApi {
  rpc NoVersion (Searchrquest) returns (SearchResponse) {
    option (google.api.http) = {
            get: "/search"
        };
  };
};

service VersionedApi {
  rpc ValidVersion (SearchRequest) returns (SearchResponse) {
    option (google.api.http) = {
      patch: "/v2.1.1/messages/{message_id}"
      body: "*"
    };
  };
  rpc  MissingVersionNumber    (SearchRequest3) returns (SearchResponse3) {
    option (google.api.http) = {
      patch: "/v/messages/{message_id}"
      body: "*"
    };
  };
  rpc  ValidPublicRPC    (SearchRequest3) returns (SearchResponse3) {
    option (google.api.http) = {
      patch: "/public/v1/messages/{message_id}"
      body: "*"
    };
  };
   rpc  ValidPublicWithDecimalVersionRPC    (SearchRequest) returns (SearchResponse) {
    option (google.api.http) = {
      patch: "/public/v1.1/messages/{message_id}"
      body: "*"
    };
  };
  rpc  NonValidPublicRPC    (SearchRequest) returns (SearchResponse) {
    option (google.api.http) = {
      patch: "/public/messages/{message_id}"
      body: "*"
    };
  };
  rpc  NonValidPublicRPCMissingVersionNumber    (SearchRequest) returns (SearchResponse) {
    option (google.api.http) = {
      patch: "/public/v/messages/{message_id}"
      body: "*"
    };
  };
};
